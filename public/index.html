<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Wars</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }
  @font-face {
    font-family: 'Press Start 2P';
    src: url('https://fonts.gstatic.com/s/pressstart2p/v15/e3t4euO8T-267oIAQAu6jDQyK3nVivM.woff2') format('woff2');
    font-display: swap;
  }
  h1 {
    font-size: 1.2rem;
    margin: 12px 0 8px;
    background: linear-gradient(90deg, #4ade80, #60a5fa, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #game-wrapper {
    width: 100%;
    max-width: 1000px;
    padding: 0 8px;
  }
  #game-container {
    position: relative;
    border: 2px solid #333;
    border-radius: 4px;
    background: #000;
    width: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
  }
  #ui-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: #111;
    border: 2px solid #333;
    border-top: none;
    border-radius: 0 0 4px 4px;
    width: 100%;
    font-size: 0.55rem;
    flex-wrap: wrap;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .control-group label {
    color: #888;
    min-width: 42px;
  }
  .control-group input[type=range] {
    width: 100px;
    accent-color: #4ade80;
  }
  .control-group .value {
    color: #4ade80;
    min-width: 32px;
    text-align: right;
  }
  #fire-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 8px 20px;
    font-family: inherit;
    font-size: 0.6rem;
    cursor: pointer;
    border-radius: 3px;
    letter-spacing: 0.1em;
    transition: all 0.15s;
  }
  #fire-btn:hover:not(:disabled) { background: #ef4444; transform: scale(1.05); }
  #fire-btn:disabled { background: #444; cursor: default; color: #888; }
  #wind-display {
    color: #60a5fa;
    margin-left: auto;
  }
  #status-bar {
    width: 100%;
    padding: 6px 16px;
    background: #0d0d1a;
    border: 2px solid #333;
    border-top: none;
    border-radius: 0 0 4px 4px;
    font-size: 0.5rem;
    color: #666;
    display: flex;
    justify-content: space-between;
  }
  /* Weapon selector */
  #weapon-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    background: #111;
    border: 2px solid #333;
    border-top: none;
    width: 100%;
    font-size: 0.45rem;
  }
  #weapon-bar label {
    color: #888;
    font-size: 0.45rem;
  }
  .weapon-btn {
    background: #222;
    color: #888;
    border: 1px solid #444;
    padding: 4px 10px;
    font-family: inherit;
    font-size: 0.45rem;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .weapon-btn:hover:not(:disabled) { border-color: #4ade80; color: #ccc; }
  .weapon-btn.active { background: #4ade80; color: #0a0a1a; border-color: #4ade80; font-weight: bold; }
  .weapon-btn:disabled { cursor: default; opacity: 0.4; }
  .weapon-btn .key-hint {
    color: #666;
    font-size: 0.35rem;
    margin-left: 4px;
  }
  .weapon-btn.active .key-hint { color: #0a0a1a; }
  /* Lobby overlay */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #overlay.visible { display: flex; }
  #overlay.hidden { display: none; }
  .overlay-box {
    background: #1a1a2e;
    border: 2px solid #4ade80;
    border-radius: 8px;
    padding: 32px;
    text-align: center;
    max-width: 400px;
    width: 90%;
  }
  .overlay-box.hidden { display: none; }
  .overlay-box h2 {
    font-size: 0.9rem;
    margin-bottom: 20px;
    color: #4ade80;
  }
  .overlay-box input {
    background: #0a0a1a;
    border: 2px solid #333;
    color: #e0e0e0;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 0.6rem;
    width: 100%;
    border-radius: 4px;
    margin-bottom: 16px;
    text-align: center;
  }
  .overlay-box input:focus { outline: none; border-color: #4ade80; }
  .overlay-box button {
    background: #4ade80;
    color: #0a0a1a;
    border: none;
    padding: 10px 24px;
    font-family: inherit;
    font-size: 0.6rem;
    cursor: pointer;
    border-radius: 4px;
    font-weight: bold;
  }
  .overlay-box button:hover { background: #22c55e; }
  .overlay-box button.secondary {
    background: transparent;
    color: #60a5fa;
    border: 2px solid #60a5fa;
  }
  .overlay-box button.secondary:hover { background: rgba(96,165,250,0.1); }
  .join-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 8px;
  }
  #code-input-group {
    display: none;
    margin-top: 12px;
  }
  #code-input {
    font-size: 1rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    max-width: 160px;
    margin: 0 auto 12px;
  }
  .room-code-display {
    background: #0a0a1a;
    border: 2px solid #4ade80;
    border-radius: 6px;
    padding: 12px 24px;
    font-size: 1.4rem;
    letter-spacing: 0.3em;
    color: #4ade80;
    margin: 12px 0;
    display: inline-block;
  }
  .room-code-label {
    font-size: 0.45rem;
    color: #888;
    margin-bottom: 4px;
  }
  .player-list {
    margin: 16px 0;
    text-align: left;
    font-size: 0.5rem;
  }
  .player-list div {
    padding: 4px 8px;
    margin: 4px 0;
    border-radius: 3px;
    background: rgba(255,255,255,0.05);
  }
  .player-list .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
  }
  #chat-log {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 250px;
    max-height: 120px;
    overflow-y: auto;
    padding: 4px 8px;
    font-size: 0.4rem;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #chat-log div {
    background: rgba(0,0,0,0.6);
    padding: 2px 6px;
    border-radius: 3px;
  }
  .winner-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    z-index: 50;
  }
  .winner-overlay .name { font-size: 1.2rem; margin: 12px 0; }
  .winner-overlay .scores-list {
    font-size: 0.5rem;
    margin: 12px 0;
    text-align: left;
  }
  .winner-overlay .scores-list div {
    padding: 3px 0;
  }
  .winner-overlay button {
    margin-top: 16px;
    background: #4ade80;
    color: #0a0a1a;
    border: none;
    padding: 10px 24px;
    font-family: inherit;
    font-size: 0.6rem;
    cursor: pointer;
    border-radius: 4px;
  }
</style>
</head>
<body>
<h1>TANK WARS</h1>

<div id="game-wrapper">
<div id="game-container">
  <canvas id="canvas" width="1000" height="750"></canvas>
  <div id="chat-log"></div>
</div>

<div id="ui-bar">
  <div class="control-group">
    <label>ANGLE</label>
    <input type="range" id="angle-slider" min="5" max="175" value="45" step="1">
    <span class="value" id="angle-val">45&deg;</span>
  </div>
  <div class="control-group">
    <label>POWER</label>
    <input type="range" id="power-slider" min="10" max="100" value="50" step="1">
    <span class="value" id="power-val">50%</span>
  </div>
  <button id="fire-btn" disabled>FIRE</button>
  <div id="wind-display">WIND: ---</div>
</div>

<div id="weapon-bar">
  <label>WEAPON:</label>
  <button class="weapon-btn active" data-weapon="standard" id="weapon-standard">STD<span class="key-hint">[1]</span></button>
  <button class="weapon-btn" data-weapon="big" id="weapon-big">BIG<span class="key-hint">[2]</span></button>
  <button class="weapon-btn" data-weapon="spread" id="weapon-spread">SPREAD<span class="key-hint">[3]</span></button>
</div>

<div id="status-bar">
  <span id="turn-info">Waiting for players...</span>
  <span id="round-info"></span>
  <span id="alive-info"></span>
</div>
</div><!-- end game-wrapper -->

<!-- Lobby overlay -->
<div id="overlay" class="hidden">
  <div class="overlay-box" id="join-screen">
    <h2>TANK WARS</h2>
    <input type="text" id="name-input" placeholder="Enter your name" maxlength="16" autofocus>
    <div class="join-buttons">
      <button id="create-btn">CREATE ROOM</button>
      <button id="join-btn" class="secondary">JOIN ROOM</button>
    </div>
    <div id="code-input-group">
      <input type="text" id="code-input" placeholder="CODE" maxlength="4">
      <button id="code-join-btn">JOIN</button>
    </div>
  </div>
  <div class="overlay-box hidden" id="lobby-screen">
    <h2>WAITING FOR PLAYERS</h2>
    <div class="room-code-label">ROOM CODE</div>
    <div class="room-code-display" id="room-code-display">----</div>
    <div class="player-list" id="player-list"></div>
    <button id="start-btn" class="hidden">START GAME</button>
    <p style="font-size:0.45rem; color:#666; margin-top:12px">Waiting for host to start...</p>
  </div>
</div>

<script>
// ============================================================
// TANK WARS CLIENT
// ============================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 1000, H = 750;
const GRAVITY = 400;

// UI elements
const overlay = document.getElementById('overlay');
const joinScreen = document.getElementById('join-screen');
const lobbyScreen = document.getElementById('lobby-screen');
const nameInput = document.getElementById('name-input');
const createBtn = document.getElementById('create-btn');
const joinBtn = document.getElementById('join-btn');
const codeInputGroup = document.getElementById('code-input-group');
const codeInput = document.getElementById('code-input');
const codeJoinBtn = document.getElementById('code-join-btn');
const startBtn = document.getElementById('start-btn');
const playerListEl = document.getElementById('player-list');
const angleSlider = document.getElementById('angle-slider');
const powerSlider = document.getElementById('power-slider');
const angleVal = document.getElementById('angle-val');
const powerVal = document.getElementById('power-val');
const fireBtn = document.getElementById('fire-btn');
const windDisplay = document.getElementById('wind-display');
const turnInfo = document.getElementById('turn-info');
const roundInfo = document.getElementById('round-info');
const aliveInfo = document.getElementById('alive-info');
const chatLog = document.getElementById('chat-log');
const roomCodeDisplay = document.getElementById('room-code-display');

// State
let ws = null;
let myId = '';
let isHost = false;
let terrain = [];
let players = [];
let wind = 0;
let currentTurn = '';
let phase = 'lobby'; // lobby, playing, animating, gameover
let myTurn = false;
let currentRoomCode = '';
let selectedWeapon = 'standard';
let currentRound = 0;
let maxRounds = 3;
let scores = {};

// Animation state
let animating = false;
let animTrajectories = [];
let animFrame = 0;
let explosionFrame = -1;
let explosionPositions = [];
const EXPLOSION_FRAMES = 20;

// Deferred state: keep pre-fire state during animation
let preFirePlayers = null; // players before fire impact
let postFirePlayers = null; // players after fire impact
let postFireTerrain = null; // terrain after crater
let preFireTerrain = null; // terrain before crater
let craterAnimFrame = -1;
const CRATER_ANIM_FRAMES = 12;

// Random name generator
const RANDOM_NAMES = ['Ace', 'Blaze', 'Cobra', 'Duke', 'Eagle', 'Falcon', 'Ghost', 'Hawk', 'Iron', 'Jet', 'Knox', 'Lynx', 'Maverick', 'Nitro', 'Onyx', 'Pyro', 'Raven', 'Storm', 'Titan', 'Viper', 'Wolf', 'Zephyr'];
function randomName() {
  return RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)];
}

// Check URL hash for room code
const hashCode = location.hash.slice(1).toUpperCase();

// Auto-join on page load
function autoJoin() {
  const name = randomName();
  nameInput.value = name;
  connect();
  const waitForOpen = setInterval(() => {
    if (ws && ws.readyState === 1) {
      clearInterval(waitForOpen);
      const msg = { type: 'join', name, autoStart: true };
      if (hashCode && hashCode.length === 4) msg.roomCode = hashCode;
      send(msg);
    }
  }, 100);
}

autoJoin();

// ============================================================
// WEBSOCKET
// ============================================================

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const basePath = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
  ws = new WebSocket(proto + '//' + location.host + basePath + 'ws');

  ws.onopen = () => console.log('Connected');
  ws.onclose = () => {
    console.log('Disconnected');
    setTimeout(() => autoJoin(), 2000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMessage(msg);
  };
}

function send(msg) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}

// ============================================================
// MESSAGE HANDLING
// ============================================================

function handleMessage(msg) {
  switch (msg.type) {
    case 'welcome':
      myId = msg.playerId;
      isHost = msg.isHost;
      players = msg.players;
      currentRoomCode = msg.roomCode || '';
      location.hash = currentRoomCode;
      // Don't show lobby — game auto-starts
      overlay.classList.remove('visible');
      break;

    case 'lobby_state':
      players = msg.players;
      if (msg.hostId) isHost = (msg.hostId === myId);
      if (msg.roomCode) currentRoomCode = msg.roomCode;
      if (msg.phase === 'waiting') {
        phase = 'lobby';
        overlay.classList.remove('visible');
        // Auto-restart: if we're host, start a new game
        if (isHost) {
          setTimeout(() => send({ type: 'start_game' }), 500);
        }
      }
      updatePlayerList();
      break;

    case 'player_joined':
      players = msg.players;
      // Update deferred state if mid-animation
      if (postFirePlayers) postFirePlayers = msg.players;
      if (preFirePlayers) {
        preFirePlayers = preFirePlayers.map(p => {
          const updated = msg.players.find(mp => mp.x === p.x && mp.y === p.y && mp.color === p.color);
          return updated || p;
        });
      }
      updateUI();
      render();
      break;

    case 'game_start':
      terrain = msg.terrain;
      players = msg.players;
      wind = msg.wind;
      currentTurn = msg.currentTurn;
      currentRound = msg.round || 1;
      maxRounds = msg.maxRounds || 3;
      scores = msg.scores || {};
      phase = 'playing';
      selectedWeapon = 'standard';
      updateWeaponButtons();
      overlay.classList.remove('visible');
      removeWinnerOverlay();
      updateUI();
      render();
      break;

    case 'turn_start':
      currentTurn = msg.currentTurn;
      wind = msg.wind;
      myTurn = (currentTurn === myId);
      phase = 'playing';
      if (myTurn) {
        // Reset weapon selection visually but don't race with user input
        selectedWeapon = 'standard';
        updateWeaponButtons();
      }
      updateUI();
      render();
      break;

    case 'aim_update': {
      const aimP = players.find(p => p.id === msg.playerId);
      if (aimP) {
        aimP.angle = msg.angle;
        aimP.power = msg.power;
        render();
      }
      break;
    }

    case 'weapon_update': {
      const wp = players.find(p => p.id === msg.playerId);
      if (wp) wp.weapon = msg.weapon;
      break;
    }

    case 'fire':
      // CRITICAL: Don't update players/terrain until animation completes
      // This prevents tanks from dropping/dying before the projectile arrives
      preFirePlayers = JSON.parse(JSON.stringify(players)); // snapshot before impact
      preFireTerrain = terrain.slice(); // snapshot terrain before crater
      postFirePlayers = msg.players;
      postFireTerrain = msg.terrain;
      phase = 'animating';
      myTurn = false;
      fireBtn.disabled = true;
      animateProjectiles(msg.trajectories, msg.explosionRadius, () => {
        // Now animate the crater forming, THEN update positions
        craterAnimFrame = 0;
        animateCrater(() => {
          players = postFirePlayers;
          terrain = postFireTerrain;
          preFirePlayers = null;
          postFirePlayers = null;
          preFireTerrain = null;
          postFireTerrain = null;
          render();
        });
      });
      break;

    case 'game_over':
      phase = 'gameover';
      players = msg.players;
      scores = msg.scores || {};
      currentRound = msg.round || currentRound;
      maxRounds = msg.maxRounds || maxRounds;
      render();
      showWinner(msg.winner, msg.isFinalRound, msg.matchWinner, msg.scores);
      break;

    case 'player_left':
      players = msg.players;
      // Also update deferred state if we're mid-animation
      if (postFirePlayers) {
        postFirePlayers = msg.players;
      }
      if (preFirePlayers) {
        // Remove from pre-fire snapshot too
        preFirePlayers = preFirePlayers.filter(p => msg.players.some(mp => mp.id === p.id));
      }
      render();
      break;

    case 'chat':
      addChatMessage(msg.name, msg.text);
      break;
  }
}

// ============================================================
// UI
// ============================================================

function showLobby() {
  overlay.classList.add('visible');
  joinScreen.classList.add('hidden');
  lobbyScreen.classList.remove('hidden');
  roomCodeDisplay.textContent = currentRoomCode || '----';
  updatePlayerList();
}

function updatePlayerList() {
  playerListEl.innerHTML = '';
  players.forEach(p => {
    const div = document.createElement('div');
    div.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.name}${p.isAI ? ' (AI)' : ''}${p.id === myId ? ' (you)' : ''}`;
    playerListEl.appendChild(div);
  });
  if (isHost) {
    startBtn.classList.remove('hidden');
    startBtn.textContent = players.length < 2 ? 'START (vs AI)' : `START (${players.length} players)`;
  } else {
    startBtn.classList.add('hidden');
  }
}

function updateUI() {
  const currentPlayer = players.find(p => p.id === currentTurn);
  myTurn = (currentTurn === myId) && phase === 'playing';

  angleSlider.disabled = !myTurn;
  powerSlider.disabled = !myTurn;
  fireBtn.disabled = !myTurn;

  // Update weapon button disabled state
  document.querySelectorAll('.weapon-btn').forEach(btn => {
    btn.disabled = !myTurn;
  });

  if (myTurn) {
    const me = players.find(p => p.id === myId);
    if (me) {
      angleSlider.value = me.angle;
      powerSlider.value = me.power;
      angleVal.textContent = me.angle + '\u00B0';
      powerVal.textContent = me.power + '%';
    }
  }

  // Wind display
  if (wind === 0) {
    windDisplay.textContent = 'WIND: CALM';
  } else {
    const arrow = wind > 0 ? '\u2192'.repeat(Math.min(3, Math.ceil(Math.abs(wind) / 4))) : '\u2190'.repeat(Math.min(3, Math.ceil(Math.abs(wind) / 4)));
    windDisplay.textContent = `WIND: ${arrow} ${Math.abs(wind)}`;
  }
  windDisplay.style.color = Math.abs(wind) > 6 ? '#f472b6' : '#60a5fa';

  // Turn info
  if (currentPlayer) {
    turnInfo.innerHTML = myTurn
      ? '<span style="color:#4ade80">YOUR TURN</span>'
      : `<span style="color:${currentPlayer.color}">${currentPlayer.name}</span>'s turn`;
  }

  // Round info
  if (currentRound > 0) {
    roundInfo.textContent = `Round ${currentRound}/${maxRounds}`;
    roundInfo.style.color = '#facc15';
  }

  // Alive count
  const alive = players.filter(p => p.hp > 0).length;
  aliveInfo.textContent = `${alive} alive`;
}

function updateWeaponButtons() {
  document.querySelectorAll('.weapon-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.weapon === selectedWeapon);
  });
}

function addChatMessage(name, text) {
  const div = document.createElement('div');
  div.innerHTML = `<span style="color:#888">${name}:</span> ${text}`;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  // Limit to 20 messages
  while (chatLog.children.length > 20) chatLog.removeChild(chatLog.firstChild);
}

function showWinner(winner, isFinalRound, matchWinner, scores) {
  removeWinnerOverlay();
  const div = document.createElement('div');
  div.className = 'winner-overlay';
  div.id = 'winner-overlay';

  let scoresHtml = '';
  if (scores) {
    scoresHtml = '<div class="scores-list">';
    // Sort by score descending
    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    for (const [id, score] of sorted) {
      const p = players.find(pp => pp.id === id);
      if (p) {
        scoresHtml += `<div><span style="color:${p.color}">${p.name}</span>: ${score} win${score !== 1 ? 's' : ''}</div>`;
      }
    }
    scoresHtml += '</div>';
  }

  if (isFinalRound) {
    // Match over
    if (matchWinner) {
      div.innerHTML = `
        <div style="font-size:1rem; color:#facc15">MATCH WINNER</div>
        <div class="name" style="color:${matchWinner.color}">${matchWinner.name}</div>
        <div style="font-size:0.5rem; color:#888">Final Scores</div>
        ${scoresHtml}
      `;
    } else {
      div.innerHTML = `
        <div style="font-size:1rem; color:#facc15">MATCH OVER</div>
        <div style="font-size:0.5rem; color:#888; margin-top:8px">It's a tie!</div>
        ${scoresHtml}
      `;
    }
  } else {
    // Round over, next round coming
    if (winner) {
      div.innerHTML = `
        <div>ROUND ${currentRound} WINNER</div>
        <div class="name" style="color:${winner.color}">${winner.name}</div>
        ${scoresHtml}
        <div style="font-size:0.45rem; color:#888; margin-top:8px">Next round starting...</div>
      `;
    } else {
      div.innerHTML = `
        <div>DRAW!</div>
        <div style="font-size:0.5rem; color:#888; margin-top:8px">Everyone is dead...</div>
        ${scoresHtml}
        <div style="font-size:0.45rem; color:#888; margin-top:8px">Next round starting...</div>
      `;
    }
  }

  document.getElementById('game-container').appendChild(div);
}

function removeWinnerOverlay() {
  const el = document.getElementById('winner-overlay');
  if (el) el.remove();
}

// ============================================================
// TRAJECTORY PREVIEW
// ============================================================

function computePreview() {
  if (!myTurn || phase !== 'playing') return [];
  const me = players.find(p => p.id === myId);
  if (!me || me.hp <= 0) return [];

  const angle = parseInt(angleSlider.value);
  const power = parseInt(powerSlider.value);
  const rad = (angle * Math.PI) / 180;
  const dir = me.facingRight ? 1 : -1;
  const speed = power * 8;
  let vx = speed * Math.cos(rad) * dir;
  let vy = -speed * Math.sin(rad);
  let x = me.x;
  let y = me.y - 15;
  const windForce = wind * 20;
  const dt = 1 / 60;
  const points = [];

  for (let i = 0; i < 3000 && points.length < 200; i++) {
    points.push([x, y]);

    vx += windForce * dt;
    vy += GRAVITY * dt;
    x += vx * dt;
    y += vy * dt;

    if (x < -50 || x > W + 50) break;
    if (y < -800) break;

    const col = Math.floor(x);
    if (col >= 0 && col < W && terrain.length > 0 && y >= terrain[col]) {
      points.push([x, terrain[col]]);
      break;
    }
  }
  return points;
}

// ============================================================
// RENDERING
// ============================================================

function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  // During animation, use pre-fire state so tanks don't jump/die early
  const renderTerrain = (phase === 'animating' && preFireTerrain) ? preFireTerrain : terrain;
  const renderPlayers = (phase === 'animating' && preFirePlayers) ? preFirePlayers : players;
  if (renderTerrain.length > 0) {
    drawTerrainArr(renderTerrain);
    drawTanksArr(renderPlayers);
    drawWindsock();
  }
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0a2e');
  grad.addColorStop(0.4, '#1a1a4e');
  grad.addColorStop(0.7, '#2a3a6e');
  grad.addColorStop(1, '#4a6a8e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 40; i++) {
    // Deterministic stars based on index
    const sx = ((i * 137 + 31) % W);
    const sy = ((i * 97 + 13) % (H * 0.4));
    ctx.fillRect(sx, sy, 1, 1);
  }
}

function drawWindsock() {
  // Draw a windsock/flag near top-right of canvas showing wind direction + strength
  const poleX = W - 60;
  const poleTop = 20;
  const poleBottom = 55;
  const poleHeight = poleBottom - poleTop;

  // Pole
  ctx.beginPath();
  ctx.moveTo(poleX, poleTop);
  ctx.lineTo(poleX, poleBottom);
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Pole cap (small circle)
  ctx.beginPath();
  ctx.arc(poleX, poleTop, 2, 0, Math.PI * 2);
  ctx.fillStyle = '#aaa';
  ctx.fill();

  // Flag/sock - length and direction based on wind
  const maxLen = 30;
  const strength = Math.min(1, Math.abs(wind) / 10);
  const sockLen = 8 + strength * maxLen;
  const dir = wind === 0 ? 0 : (wind > 0 ? 1 : -1);

  // Sock hangs down when no wind, blows horizontal in strong wind
  const droop = (1 - strength) * 12; // vertical droop when calm

  // Draw 3 tapered segments (classic windsock stripes)
  const segments = 5;
  const colors = ['#dc2626', '#fff', '#dc2626', '#fff', '#dc2626'];
  const segLen = sockLen / segments;

  for (let i = 0; i < segments; i++) {
    const t0 = i / segments;
    const t1 = (i + 1) / segments;
    // Taper from wide at pole to narrow at tip
    const w0 = 6 * (1 - t0 * 0.6);
    const w1 = 6 * (1 - t1 * 0.6);
    const x0 = poleX + dir * t0 * sockLen;
    const x1 = poleX + dir * t1 * sockLen;
    const y0 = poleTop + 2 + droop * t0 * t0;
    const y1 = poleTop + 2 + droop * t1 * t1;

    ctx.beginPath();
    ctx.moveTo(x0, y0 - w0 / 2);
    ctx.lineTo(x1, y1 - w1 / 2);
    ctx.lineTo(x1, y1 + w1 / 2);
    ctx.lineTo(x0, y0 + w0 / 2);
    ctx.closePath();
    ctx.fillStyle = wind === 0 ? '#666' : colors[i];
    ctx.fill();
  }

  // Wind speed text below pole
  ctx.font = '7px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = Math.abs(wind) > 6 ? '#f472b6' : '#60a5fa';
  ctx.fillText(wind === 0 ? 'CALM' : `${Math.abs(wind)}`, poleX, poleBottom + 10);
}

function drawTerrainArr(t) {
  // Main terrain fill
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x < t.length; x++) {
    ctx.lineTo(x, t[x]);
  }
  ctx.lineTo(W, H);
  ctx.closePath();

  const tGrad = ctx.createLinearGradient(0, 200, 0, H);
  tGrad.addColorStop(0, '#5a3a1a');
  tGrad.addColorStop(0.3, '#4a2a10');
  tGrad.addColorStop(1, '#2a1a08');
  ctx.fillStyle = tGrad;
  ctx.fill();

  // Grass line on top
  ctx.beginPath();
  ctx.moveTo(0, t[0]);
  for (let x = 1; x < t.length; x++) {
    ctx.lineTo(x, t[x]);
  }
  ctx.strokeStyle = '#2d8f2d';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawTrajectoryPreview() {
  const preview = computePreview();
  if (preview.length < 2) return;

  for (let i = 0; i < preview.length; i += 3) {
    const pt = preview[i];
    const alpha = 0.15 + 0.15 * (1 - i / preview.length);
    ctx.beginPath();
    ctx.arc(pt[0], pt[1], 1.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(74, 222, 128, ${alpha})`;
    ctx.fill();
  }
}

function drawTanksArr(arr) {
  arr.forEach(p => {
    if (p.hp <= 0) {
      drawDeadTank(p);
      return;
    }
    drawTank(p);
    drawHPBar(p);
    drawNameTag(p);
  });
}

function drawTank(p) {
  const x = p.x;
  const y = p.y;

  // Treads
  ctx.fillStyle = darken(p.color, 0.4);
  roundRect(ctx, x - 13, y - 4, 26, 6, 2);
  ctx.fill();

  // Body
  ctx.fillStyle = p.color;
  roundRect(ctx, x - 10, y - 12, 20, 9, 2);
  ctx.fill();

  // Turret dome
  ctx.beginPath();
  ctx.arc(x, y - 12, 6, Math.PI, 0);
  ctx.fillStyle = lighten(p.color, 0.2);
  ctx.fill();

  // Barrel
  const rad = (p.angle * Math.PI) / 180;
  const barrelLen = 20;
  const dir = p.facingRight ? 1 : -1;
  const bx = x + Math.cos(rad) * barrelLen * dir;
  const by = y - 12 - Math.sin(rad) * barrelLen;
  ctx.strokeStyle = darken(p.color, 0.3);
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y - 12);
  ctx.lineTo(bx, by);
  ctx.stroke();

  // Highlight if current turn
  if (p.id === currentTurn && phase === 'playing') {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(x, y - 8, 22, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawDeadTank(p) {
  const x = p.x;
  const y = p.y;
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#555';
  roundRect(ctx, x - 13, y - 4, 26, 6, 2);
  ctx.fill();
  ctx.fillStyle = '#444';
  roundRect(ctx, x - 10, y - 10, 20, 7, 2);
  ctx.fill();
  // X mark
  ctx.strokeStyle = '#f44';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 6, y - 14);
  ctx.lineTo(x + 6, y - 6);
  ctx.moveTo(x + 6, y - 14);
  ctx.lineTo(x - 6, y - 6);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawHPBar(p) {
  const x = p.x;
  const y = p.y + 6; // Below tank treads
  const w = 30;
  const h = 4;
  const pct = p.hp / 100;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x - w/2 - 1, y - 1, w + 2, h + 2);

  const color = pct > 0.5 ? '#4ade80' : pct > 0.25 ? '#facc15' : '#ef4444';
  ctx.fillStyle = color;
  ctx.fillRect(x - w/2, y, w * pct, h);
}

function drawNameTag(p) {
  ctx.font = '7px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = p.id === currentTurn ? '#fff' : 'rgba(255,255,255,0.5)';
  ctx.fillText(p.name, p.x, p.y - 28);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function darken(hex, amount) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgb(${Math.floor(r * (1 - amount))},${Math.floor(g * (1 - amount))},${Math.floor(b * (1 - amount))})`;
}

function lighten(hex, amount) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgb(${Math.min(255, Math.floor(r + (255 - r) * amount))},${Math.min(255, Math.floor(g + (255 - g) * amount))},${Math.min(255, Math.floor(b + (255 - b) * amount))})`;
}

// ============================================================
// ANIMATION
// ============================================================

function animateProjectiles(trajectories, explosionRadius, onDone) {
  animating = true;
  animTrajectories = trajectories;
  animFrame = 0;
  explosionFrame = -1;
  explosionPositions = trajectories
    .filter(t => t.impactX >= 0)
    .map(t => ({ x: t.impactX, y: t.impactY, radius: explosionRadius }));

  // Find longest trajectory
  const maxLen = Math.max(...trajectories.map(t => t.points.length));

  // Skip frames for long trajectories to keep animation snappy
  const skip = maxLen > 200 ? 3 : maxLen > 100 ? 2 : 1;

  function step() {
    if (explosionFrame >= 0) {
      // Explosion animation
      render();
      for (const pos of explosionPositions) {
        drawExplosion(pos.x, pos.y, pos.radius, explosionFrame / EXPLOSION_FRAMES);
      }
      explosionFrame++;
      if (explosionFrame > EXPLOSION_FRAMES) {
        animating = false;
        onDone();
        return;
      }
      requestAnimationFrame(step);
      return;
    }

    // Check if all trajectories are done
    let allDone = true;
    for (const traj of animTrajectories) {
      if (animFrame < traj.points.length) {
        allDone = false;
        break;
      }
    }

    if (allDone) {
      if (explosionPositions.length > 0) {
        explosionFrame = 0;
        requestAnimationFrame(step);
      } else {
        animating = false;
        onDone();
      }
      return;
    }

    render();

    // Draw all trajectories
    for (const traj of animTrajectories) {
      const frameIdx = Math.min(animFrame, traj.points.length - 1);

      // Draw trail
      const trailLen = 6;
      for (let i = Math.max(0, frameIdx - trailLen); i <= frameIdx; i++) {
        const pt = traj.points[i];
        const alpha = 1 - (frameIdx - i) / (trailLen + 1);
        const size = 2 + alpha * 2;
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 200, 50, ${alpha * 0.8})`;
        ctx.fill();
      }

      // Draw projectile
      if (frameIdx < traj.points.length) {
        const pt = traj.points[frameIdx];
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 3, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,200,50,0.3)';
        ctx.fill();
      }
    }

    animFrame += skip;
    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

function drawExplosion(x, y, radius, progress) {
  const r = radius * (0.3 + progress * 0.7);

  // Outer glow
  const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, r * 1.5);
  glowGrad.addColorStop(0, `rgba(255, 200, 50, ${0.4 * (1 - progress)})`);
  glowGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
  ctx.beginPath();
  ctx.arc(x, y, r * 1.5, 0, Math.PI * 2);
  ctx.fillStyle = glowGrad;
  ctx.fill();

  // Main explosion
  const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
  if (progress < 0.4) {
    grad.addColorStop(0, `rgba(255, 255, 200, ${1 - progress})`);
    grad.addColorStop(0.5, `rgba(255, 150, 0, ${0.8 - progress})`);
    grad.addColorStop(1, `rgba(200, 50, 0, ${0.6 - progress})`);
  } else {
    const fade = (progress - 0.4) / 0.6;
    grad.addColorStop(0, `rgba(150, 100, 50, ${0.5 * (1 - fade)})`);
    grad.addColorStop(1, `rgba(80, 80, 80, ${0.3 * (1 - fade)})`);
  }
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Particles
  if (progress < 0.6) {
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + progress * 2;
      const dist = r * (0.5 + progress * 1.2);
      const px = x + Math.cos(angle) * dist;
      const py = y + Math.sin(angle) * dist;
      const pSize = 2 * (1 - progress);
      ctx.beginPath();
      ctx.arc(px, py, pSize, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, ${150 + Math.random() * 100}, 0, ${0.8 * (1 - progress)})`;
      ctx.fill();
    }
  }
}

// ============================================================
// CRATER ANIMATION — smooth terrain transition after explosion
// ============================================================

function animateCrater(onDone) {
  if (!preFireTerrain || !postFireTerrain) {
    onDone();
    return;
  }

  let frame = 0;
  const interpTerrain = preFireTerrain.slice();

  function step() {
    frame++;
    const t = Math.min(1, frame / CRATER_ANIM_FRAMES);
    // Ease-out cubic
    const ease = 1 - Math.pow(1 - t, 3);

    // Interpolate terrain
    for (let x = 0; x < interpTerrain.length; x++) {
      interpTerrain[x] = preFireTerrain[x] + (postFireTerrain[x] - preFireTerrain[x]) * ease;
    }

    // Also interpolate player y positions (tanks sliding down into craters)
    const interpPlayers = JSON.parse(JSON.stringify(preFirePlayers));
    for (let i = 0; i < interpPlayers.length; i++) {
      const pre = preFirePlayers[i];
      const post = postFirePlayers.find(p => p.id === pre.id);
      if (post) {
        interpPlayers[i].y = pre.y + (post.y - pre.y) * ease;
        // Keep pre-fire HP during crater anim (damage already shown via explosion)
        // But if they died, fade them at the end
        if (post.hp <= 0 && t > 0.7) {
          interpPlayers[i].hp = 0;
        }
      }
    }

    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawTerrainArr(interpTerrain);
    drawTanksArr(interpPlayers);

    if (frame >= CRATER_ANIM_FRAMES) {
      onDone();
      return;
    }
    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

// ============================================================
// INPUT HANDLING
// ============================================================

function doJoin(roomCode) {
  const name = nameInput.value.trim() || randomName();
  connect();
  const waitForOpen = setInterval(() => {
    if (ws && ws.readyState === 1) {
      clearInterval(waitForOpen);
      const msg = { type: 'join', name, autoStart: true };
      if (roomCode) msg.roomCode = roomCode;
      send(msg);
    }
  }, 100);
}

createBtn.onclick = () => {
  doJoin(null);
};

joinBtn.onclick = () => {
  const isVisible = codeInputGroup.style.display === 'block';
  codeInputGroup.style.display = isVisible ? 'none' : 'block';
  if (!isVisible) codeInput.focus();
};

codeJoinBtn.onclick = () => {
  const code = codeInput.value.trim().toUpperCase();
  if (code.length !== 4) {
    codeInput.style.borderColor = '#ef4444';
    return;
  }
  codeInput.style.borderColor = '#333';
  doJoin(code);
};

codeInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') codeJoinBtn.click();
});

nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') createBtn.click();
});

startBtn.onclick = () => {
  send({ type: 'start_game' });
};

angleSlider.oninput = () => {
  angleVal.textContent = angleSlider.value + '\u00B0';
  if (myTurn) {
    const me = players.find(p => p.id === myId);
    if (me) me.angle = parseInt(angleSlider.value);
    send({ type: 'set_aim', angle: parseInt(angleSlider.value), power: parseInt(powerSlider.value) });
    render();
  }
};

powerSlider.oninput = () => {
  powerVal.textContent = powerSlider.value + '%';
  if (myTurn) {
    const me = players.find(p => p.id === myId);
    if (me) me.power = parseInt(powerSlider.value);
    send({ type: 'set_aim', angle: parseInt(angleSlider.value), power: parseInt(powerSlider.value) });
    render();
  }
};

fireBtn.onclick = () => {
  if (myTurn) {
    send({ type: 'fire' });
    fireBtn.disabled = true;
    myTurn = false;
  }
};

// Weapon buttons
document.querySelectorAll('.weapon-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!myTurn) return;
    selectedWeapon = btn.dataset.weapon;
    updateWeaponButtons();
    send({ type: 'set_weapon', weapon: selectedWeapon });
  });
});

// Keyboard controls
document.addEventListener('keydown', (e) => {
  if (!myTurn || phase !== 'playing') return;
  if (document.activeElement === nameInput || document.activeElement === codeInput) return;

  switch (e.key) {
    case 'ArrowLeft':
      angleSlider.value = Math.min(175, parseInt(angleSlider.value) + 2);
      angleSlider.oninput();
      e.preventDefault();
      break;
    case 'ArrowRight':
      angleSlider.value = Math.max(5, parseInt(angleSlider.value) - 2);
      angleSlider.oninput();
      e.preventDefault();
      break;
    case 'ArrowUp':
      powerSlider.value = Math.min(100, parseInt(powerSlider.value) + 2);
      powerSlider.oninput();
      e.preventDefault();
      break;
    case 'ArrowDown':
      powerSlider.value = Math.max(10, parseInt(powerSlider.value) - 2);
      powerSlider.oninput();
      e.preventDefault();
      break;
    case ' ':
      fireBtn.click();
      e.preventDefault();
      break;
    case '1':
      selectedWeapon = 'standard';
      updateWeaponButtons();
      send({ type: 'set_weapon', weapon: selectedWeapon });
      e.preventDefault();
      break;
    case '2':
      selectedWeapon = 'big';
      updateWeaponButtons();
      send({ type: 'set_weapon', weapon: selectedWeapon });
      e.preventDefault();
      break;
    case '3':
      selectedWeapon = 'spread';
      updateWeaponButtons();
      send({ type: 'set_weapon', weapon: selectedWeapon });
      e.preventDefault();
      break;
  }
});

// ============================================================
// INIT
// ============================================================

// Draw initial screen
drawSky();
ctx.font = '12px monospace';
ctx.textAlign = 'center';
ctx.fillStyle = '#666';
ctx.fillText('Enter your name to join', W / 2, H / 2);
</script>
